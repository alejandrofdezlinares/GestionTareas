<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios sin tareas</title>
</head>
<body>
    <h1>Usuarios sin tareas asignadas</h1>

    <ul>
        {% for usuario in usuarios %}
            <li>{{ usuario.nombre }}</li>
        {% empty %}
            <li>No se encontraron usuarios sin tareas.</li>
        {% endfor %}
    </ul>

    <a href="/">Volver al inicio</a>
</body>
</html>
