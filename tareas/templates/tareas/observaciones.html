{% extends 'tareas/base.html' %}

{% block cabecera %}
<h1>Buscar tareas por observaciones</h1>
{% endblock %}

{% block contenido %}

<form method="get">
    <input type="text" name="q" value="{{ termino }}" placeholder="Texto a buscar">
    <button type="submit">Buscar</button>
</form>

<ul>
    {% for tarea in tareas %}
        {% include 'tareas/parciales/tarea_simple.html' %}
    {% empty %}
        <li>No se encontraron tareas.</li>
    {% endfor %}
</ul>

<a href="/">Volver al inicio</a>

{% endblock %}
