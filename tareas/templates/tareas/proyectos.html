<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de proyectos</title>
</head>
<body>
    <h1>Lista de proyectos</h1>

    <ul>
        {% for proyecto in proyectos %}
            <li>{{ proyecto.nombre }}</li>
        {% empty %}
            <li>No hay proyectos.</li>
        {% endfor %}
    </ul>

    <a href="/">Volver al inicio</a>
</body>
</html>
